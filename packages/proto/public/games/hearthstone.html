<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hearthstone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/reset.css" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/page.css" />
  <script type="importmap">
  {
    "imports": {
      "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
      "@unbndl/html": "https://unpkg.com/@unbndl/html",
      "@unbndl/view": "https://unpkg.com/@unbndl/view"
    }
  }
  </script>
  <script type="module">
    import { define } from "@unbndl/html";
    import { Auth } from "@unbndl/auth";
    import { HeaderElement } from "/js/header.js";
    import { GameInfoElement } from "/js/game-info.js";
    import { GameInfoListElement } from "/js/game-info-list.js";

    define({
      "auth-provider": Auth.Provider,
      "app-header": HeaderElement,
      "game-info": GameInfoElement,
      "game-info-list": GameInfoListElement
    });
  </script>
</head>
<body>
  <auth-provider>
    <app-header></app-header>

    <main>
      <h1>Hearthstone</h1>
      <game-info-list src="/data/hearthstone.json"></game-info-list>

      <p class="back-link"><a href="../index.html">← Back to Home</a></p>
    </main>
  </auth-provider>
</body>
</html>
